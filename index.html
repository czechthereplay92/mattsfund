<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You'll Be Alright Fund</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600;1,700&family=EB+Garamond:wght@400;500;600&family=Cormorant:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #0a0605;
    --bg-2: #22100a;
    --surface: rgba(26,14,11,0.78);
    --surface-raised: rgba(38,20,14,0.9);
    --line: #402920;
    --crimson: #b23a2a;
    --crimson-bright: #d3543f;
    --crimson-dim: #6e241a;
    --amber: #c9863f;
    --text: #ece1cf;
    --text-muted: #ab9787;
    --green: #6f8a52;
    --green-bright: #8aa869;
    --focus: #d3543f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(178,58,42,0.28), transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 100%, rgba(178,58,42,0.12), transparent 60%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 45%, #050302 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:'EB Garamond', serif;
    font-size:17px;
    line-height:1.55;
    min-height:100vh;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.35;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    z-index:0;
  }
  .wrap{
    max-width:600px;
    margin:0 auto;
    padding:48px 24px 80px;
    position:relative;
    z-index:1;
  }
  h1,h2,h3{
    font-family:'Playfair Display', serif;
    font-weight:600;
    margin:0;
    letter-spacing:0.003em;
  }
  .hero{margin-bottom:32px;}
  .hero .kicker{
    color:var(--crimson-bright);
    font-family:'EB Garamond', serif;
    font-size:13px;
    letter-spacing:0.22em;
    font-weight:600;
    margin-bottom:12px;
    text-transform:uppercase;
  }
  .hero h1{
    font-size:44px;
    line-height:1.1;
    font-style:italic;
    font-weight:600;
    color:var(--text);
    text-shadow:0 2px 24px rgba(178,58,42,0.25);
  }
  .ribbon{
    height:1px;
    width:72px;
    background:linear-gradient(90deg, var(--crimson-bright), transparent);
    margin:20px 0 18px;
  }
  .hero p{
    color:var(--text-muted);
    font-size:17px;
    max-width:48ch;
  }
  .nav{
    display:flex;
    gap:20px;
    margin-bottom:36px;
    border-bottom:1px solid var(--line);
  }
  .nav button{
    background:none;
    border:none;
    color:var(--text-muted);
    font-family:'EB Garamond', serif;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.04em;
    padding:10px 2px 12px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .nav button.active{
    color:var(--text);
    border-bottom-color:var(--crimson-bright);
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:2px;
    padding:30px 28px;
    backdrop-filter: blur(2px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  label{
    display:block;
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:7px;
    font-weight:600;
    letter-spacing:0.03em;
  }
  .field{margin-bottom:20px;}
  .amount-row{
    display:flex;
    align-items:stretch;
    border:1px solid var(--line);
    border-radius:2px;
    overflow:hidden;
    background:var(--surface-raised);
  }
  .amount-row .prefix{
    display:flex;
    align-items:center;
    padding:0 14px;
    color:var(--crimson-bright);
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:18px;
    background:var(--surface-raised);
    border-right:1px solid var(--line);
  }
  input[type=text], input[type=number], input[type=password]{
    width:100%;
    background:var(--surface-raised);
    border:1px solid var(--line);
    border-radius:2px;
    padding:12px 14px;
    color:var(--text);
    font-family:'EB Garamond', serif;
    font-size:17px;
  }
  .amount-row input{
    border:none;
    border-radius:0;
  }
  input:focus{
    outline:none;
    border-color:var(--focus);
  }
  .amount-row:focus-within{
    border-color:var(--focus);
  }
  button.primary{
    width:100%;
    background:linear-gradient(180deg, var(--crimson-bright), var(--crimson));
    color:#f3e9dc;
    border:1px solid var(--crimson-dim);
    border-radius:2px;
    padding:14px 18px;
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:17px;
    font-weight:600;
    letter-spacing:0.01em;
    cursor:pointer;
    margin-top:6px;
  }
  button.primary:hover{filter:brightness(1.1);}
  button.primary:disabled{
    background:var(--crimson-dim);
    color:#7a6a5f;
    cursor:not-allowed;
  }
  button.ghost{
    background:none;
    border:1px solid var(--line);
    color:var(--text-muted);
    border-radius:2px;
    padding:10px 16px;
    font-family:'EB Garamond', serif;
    font-size:15px;
    cursor:pointer;
  }
  button.ghost:hover{color:var(--text); border-color:var(--text-muted);}
  .error-text{
    color:var(--crimson-bright);
    font-size:13px;
    margin-top:8px;
  }
  .summary{
    background:var(--surface-raised);
    border:1px solid var(--line);
    border-radius:2px;
    padding:16px 18px;
    margin-bottom:22px;
  }
  .summary .row{
    display:flex;
    justify-content:space-between;
    font-size:15px;
    color:var(--text-muted);
  }
  .summary .row + .row{margin-top:6px;}
  .summary .row span.val{color:var(--text); font-weight:600;}
  .pay-options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .pay-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--surface-raised);
    border:1px solid var(--line);
    border-radius:2px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--text);
    cursor:pointer;
  }
  .pay-option:hover{border-color:var(--crimson-dim);}
  .pay-option .name{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:18px;
    font-weight:500;
  }
  .pay-option .go{
    color:var(--crimson-bright);
    font-size:13px;
    font-weight:600;
    letter-spacing:0.03em;
  }
  .confirm-box{
    text-align:left;
    padding:8px 0 4px;
  }
  .confirm-box .big{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:24px;
    margin-bottom:8px;
  }
  .confirm-box p{color:var(--text-muted); font-size:15px; margin:0 0 22px;}
  .back-link{
    display:inline-block;
    margin-top:18px;
    color:var(--text-muted);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
  }
  /* admin */
  .admin-gate{max-width:340px;}
  .admin-list{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
  .donation-row{
    background:var(--surface-raised);
    border:1px solid var(--line);
    border-radius:2px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .donation-row .who{font-family:'Playfair Display', serif; font-style:italic; font-size:17px;}
  .donation-row .meta{color:var(--text-muted); font-size:12.5px; margin-top:3px; letter-spacing:0.02em;}
  .status-pill{
    font-size:11px;
    font-weight:600;
    letter-spacing:0.08em;
    padding:4px 9px;
    border-radius:2px;
    text-transform:uppercase;
    white-space:nowrap;
    font-family:'EB Garamond', serif;
  }
  .status-pill.pending{background:rgba(201,134,63,0.18); color:var(--amber);}
  .status-pill.completed{background:rgba(138,168,105,0.15); color:var(--green-bright);}
  .mark-btn{
    background:var(--green);
    color:#0d1408;
    border:none;
    border-radius:2px;
    padding:8px 12px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.02em;
    cursor:pointer;
    white-space:nowrap;
  }
  .mark-btn:hover{background:var(--green-bright);}
  .mark-btn:disabled{background:var(--line); color:var(--text-muted); cursor:default;}
  .section-title{
    font-family:'EB Garamond', serif;
    font-size:13px;
    letter-spacing:0.16em;
    color:var(--crimson-bright);
    text-transform:uppercase;
    font-weight:600;
    margin:32px 0 12px;
  }
  .section-title:first-of-type{margin-top:0;}
  .empty-state{
    color:var(--text-muted);
    font-size:15px;
    padding:20px 0;
  }
  .tabs-inline{display:flex; gap:10px; margin-bottom:24px;}
  .tabs-inline button{
    background:var(--surface-raised);
    border:1px solid var(--line);
    color:var(--text-muted);
    padding:8px 14px;
    border-radius:2px;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.02em;
    cursor:pointer;
  }
  .tabs-inline button.active{
    color:#f3e9dc;
    background:var(--crimson);
    border-color:var(--crimson);
  }
  .help-text{color:var(--text-muted); font-size:12.5px; margin-top:4px;}
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--surface-raised);
    border:1px solid var(--crimson-dim);
    color:var(--text);
    padding:12px 20px;
    border-radius:2px;
    font-size:14px;
    box-shadow:0 6px 20px rgba(0,0,0,0.5);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:50;
  }
  .toast.show{opacity:1;}
  .logout-link{
    margin-left:auto;
    color:var(--text-muted);
    font-size:12.5px;
    cursor:pointer;
    text-decoration:underline;
    align-self:center;
  }
  .admin-header-row{display:flex; align-items:center; margin-bottom:4px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(msg, duration){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), duration || 3200);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtAmount(a){
  const n = Number(a);
  return isNaN(n) ? a : n.toFixed(2);
}

function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric'}) + ' · ' +
         d.toLocaleTimeString(undefined,{hour:'numeric', minute:'2-digit'});
}

// ---------- API helpers ----------
async function apiGet(path){
  const resp = await fetch(path);
  return resp.json();
}
async function apiPost(path, body){
  const resp = await fetch(path, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  return resp.json();
}

// ---------- state ----------
let state = {
  view: 'donate',           // 'donate' | 'admin'
  donateStep: 'form',       // 'form' | 'pay' | 'done'
  donateData: {username:'', amount:''},
  chosenMethod: null,
  publicSettings: {cashapp:'', venmo:'', paypal:'', hasPassword:false},
  adminSettings: null,      // full settings, only populated after login
  adminPassword: null,      // held in memory only, re-sent with each protected request
  donations: [],
  adminAuthed: false,
  adminTab: 'queue',        // 'queue' | 'settings'
  loading: true
};

async function init(){
  try{
    state.publicSettings = await apiGet('/api/public-settings');
  }catch(e){
    console.error('Failed to load settings', e);
  }
  state.loading = false;
  render();
}

// ---------- render ----------
function render(){
  if(state.loading){
    app.innerHTML = `<div class="wrap"><p class="help-text">Loading…</p></div>`;
    return;
  }
  app.innerHTML = `
    ${renderHero()}
    ${renderNav()}
    <div id="view-slot"></div>
  `;
  document.getElementById('view-slot').innerHTML =
    state.view === 'donate' ? renderDonateView() : renderAdminView();

  attachHandlers();
}

function renderHero(){
  return `
    <div class="hero">
      <div class="kicker">Matt's Alright Discord</div>
      <h1>You'll Be Alright Fund</h1>
      <div class="ribbon"></div>
      <p>When someone in the formation needs backup, this is how we cover it. Put in what you can — every dollar gets logged and gets there.</p>
    </div>
  `;
}

function renderNav(){
  return `
    <div class="nav">
      <button data-nav="donate" class="${state.view==='donate'?'active':''}">Donate</button>
      <button data-nav="admin" class="${state.view==='admin'?'active':''}">Admin</button>
    </div>
  `;
}

function renderDonateView(){
  if(state.donateStep === 'form') return renderDonateForm();
  if(state.donateStep === 'pay') return renderPayOptions();
  return renderDonateDone();
}

function renderDonateForm(){
  return `
    <div class="card">
      <div class="field">
        <label for="f-username">Your name or handle</label>
        <input type="text" id="f-username" placeholder="e.g. Doc Holloway" value="${escapeHtml(state.donateData.username)}" maxlength="60">
      </div>
      <div class="field">
        <label for="f-amount">Amount</label>
        <div class="amount-row">
          <div class="prefix">$</div>
          <input type="number" id="f-amount" placeholder="25" min="1" step="0.01" value="${escapeHtml(state.donateData.amount)}">
        </div>
      </div>
      <button class="primary" id="btn-continue">Complete Donation</button>
      <div class="error-text" id="form-error" style="display:none;"></div>
    </div>
  `;
}

function renderPayOptions(){
  const s = state.publicSettings || {};
  const methods = [
    {key:'cashapp', label:'Cash App', link: s.cashapp ? `https://cash.app/${s.cashapp.replace(/^\$/,'$')}` : null},
    {key:'venmo', label:'Venmo', link: s.venmo ? `https://venmo.com/u/${s.venmo.replace(/^@/,'')}` : null},
    {key:'paypal', label:'PayPal', link: s.paypal ? `https://paypal.me/${s.paypal.replace(/^@/,'')}` : null},
  ];
  const anyConfigured = methods.some(m => m.link);

  return `
    <div class="card">
      <div class="summary">
        <div class="row"><span>Name</span><span class="val">${escapeHtml(state.donateData.username)}</span></div>
        <div class="row"><span>Amount</span><span class="val">$${fmtAmount(state.donateData.amount)}</span></div>
      </div>
      <label>Choose how you're sending it</label>
      <div class="pay-options">
        ${anyConfigured ? methods.map(m => m.link ? `
          <div class="pay-option" data-method="${m.key}" data-link="${m.link}">
            <span class="name">${m.label}</span>
            <span class="go">Open →</span>
          </div>
        ` : '').join('') : `<div class="empty-state">No payment methods are set up yet. Ask an admin to add Cash App, Venmo, or PayPal in the Admin → Settings tab.</div>`}
      </div>
      <div class="back-link" id="btn-back-form">← Back</div>
    </div>
  `;
}

function renderDonateDone(){
  return `
    <div class="card">
      <div class="confirm-box">
        <div class="big">You're logged, ${escapeHtml(state.donateData.username)}.</div>
        <p>Your $${fmtAmount(state.donateData.amount)} donation via ${state.chosenMethod} is marked pending. Once it's received it'll show as complete and post to the channel.</p>
        <button class="ghost" id="btn-new-donation">Make another donation</button>
      </div>
    </div>
  `;
}

function renderAdminView(){
  if(!state.adminAuthed){
    if(!state.publicSettings.hasPassword){
      return `
        <div class="card admin-gate">
          <h3 style="margin-bottom:14px;">Set up the admin panel</h3>
          <p class="help-text" style="margin-bottom:16px;">No admin password is set yet. Choose one now — you'll need it to get back in.</p>
          <div class="field">
            <label for="f-newpass">New admin password</label>
            <input type="password" id="f-newpass" placeholder="Choose a password">
          </div>
          <button class="primary" id="btn-set-password">Set password &amp; continue</button>
          <div class="error-text" id="setpass-error" style="display:none;"></div>
        </div>
      `;
    }
    return `
      <div class="card admin-gate">
        <h3 style="margin-bottom:14px;">Admin sign-in</h3>
        <div class="field">
          <label for="f-password">Password</label>
          <input type="password" id="f-password" placeholder="Enter admin password">
        </div>
        <button class="primary" id="btn-login">Sign in</button>
        <div class="error-text" id="login-error" style="display:none;">That password isn't right.</div>
      </div>
    `;
  }

  return `
    <div class="admin-header-row">
      <div class="tabs-inline">
        <button data-atab="queue" class="${state.adminTab==='queue'?'active':''}">Donations</button>
        <button data-atab="settings" class="${state.adminTab==='settings'?'active':''}">Settings</button>
      </div>
      <span class="logout-link" id="btn-logout">Sign out</span>
    </div>
    ${state.adminTab === 'queue' ? renderAdminQueue() : renderAdminSettings()}
  `;
}

function renderAdminQueue(){
  const pending = state.donations.filter(d => d.status === 'pending').sort((a,b)=>b.createdAt-a.createdAt);
  const completed = state.donations.filter(d => d.status === 'completed').sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));

  const row = (d, isPending) => `
    <div class="donation-row">
      <div>
        <div class="who">${escapeHtml(d.username)} — $${fmtAmount(d.amount)}</div>
        <div class="meta">${d.method} · ${fmtTime(d.createdAt)}</div>
      </div>
      ${isPending
        ? `<button class="mark-btn" data-complete="${d.id}">Mark complete</button>`
        : `<span class="status-pill completed">Completed</span>`
      }
    </div>
  `;

  return `
    <div class="section-title">Pending (${pending.length})</div>
    <div class="admin-list">
      ${pending.length ? pending.map(d=>row(d,true)).join('') : '<div class="empty-state">No pending donations right now.</div>'}
    </div>
    <div class="section-title">Completed (${completed.length})</div>
    <div class="admin-list">
      ${completed.length ? completed.slice(0,20).map(d=>row(d,false)).join('') : '<div class="empty-state">Nothing marked complete yet.</div>'}
    </div>
    ${state.donations.length ? `
      <button class="ghost" id="btn-clear-history" style="margin-top:24px; color:var(--crimson-bright); border-color:var(--crimson-dim);">Clear transaction history</button>
    ` : ''}
  `;
}

function renderAdminSettings(){
  const s = state.adminSettings || {};
  return `
    <div class="card">
      <div class="field">
        <label for="s-webhook">Discord webhook URL</label>
        <input type="text" id="s-webhook" placeholder="https://discord.com/api/webhooks/…" value="${escapeHtml(s.webhookUrl||'')}">
        <div class="help-text">Posts a message here whenever a donation is marked complete.</div>
        <button class="ghost" id="btn-test-webhook" style="margin-top:10px;">Send test message</button>
        <div class="help-text" id="webhook-test-status" style="margin-top:8px;"></div>
      </div>
      <div class="field">
        <label for="s-cashapp">Cash App tag</label>
        <input type="text" id="s-cashapp" placeholder="$YourTag" value="${escapeHtml(s.cashapp||'')}">
      </div>
      <div class="field">
        <label for="s-venmo">Venmo username</label>
        <input type="text" id="s-venmo" placeholder="@YourVenmo" value="${escapeHtml(s.venmo||'')}">
      </div>
      <div class="field">
        <label for="s-paypal">PayPal.me username</label>
        <input type="text" id="s-paypal" placeholder="YourPayPal" value="${escapeHtml(s.paypal||'')}">
      </div>
      <button class="primary" id="btn-save-settings">Save settings</button>
    </div>
    <p class="help-text" style="margin-top:14px;">The webhook URL and admin password now live server-side in Netlify Blobs, not in the page itself — the browser never sees the webhook URL except here in your own admin session.</p>
  `;
}

// ---------- handlers ----------
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.onclick = async () => {
      state.view = btn.dataset.nav;
      if(state.view === 'admin' && state.adminAuthed){
        await loadDonations();
      }
      render();
    };
  });

  // donate form
  const contBtn = document.getElementById('btn-continue');
  if(contBtn){
    contBtn.onclick = () => {
      const username = document.getElementById('f-username').value.trim();
      const amount = document.getElementById('f-amount').value.trim();
      const errEl = document.getElementById('form-error');
      if(!username){ errEl.textContent = 'Enter your name or handle.'; errEl.style.display='block'; return; }
      const num = Number(amount);
      if(!amount || isNaN(num) || num <= 0){ errEl.textContent = 'Enter a valid amount.'; errEl.style.display='block'; return; }
      state.donateData = {username, amount: num};
      state.donateStep = 'pay';
      render();
    };
  }

  const backBtn = document.getElementById('btn-back-form');
  if(backBtn){
    backBtn.onclick = () => { state.donateStep = 'form'; render(); };
  }

  document.querySelectorAll('[data-method]').forEach(el=>{
    el.onclick = async () => {
      const method = el.dataset.method;
      const link = el.dataset.link;
      const label = method === 'cashapp' ? 'Cash App' : method === 'venmo' ? 'Venmo' : 'PayPal';
      try{
        const result = await apiPost('/api/donations', {
          username: state.donateData.username,
          amount: state.donateData.amount,
          method: label
        });
        if(!result.ok){
          showToast('Something went wrong logging your donation — try again.');
          return;
        }
      }catch(e){
        showToast('Something went wrong logging your donation — try again.');
        return;
      }
      state.chosenMethod = label;
      window.open(link, '_blank');
      state.donateStep = 'done';
      render();
    };
  });

  const newDonationBtn = document.getElementById('btn-new-donation');
  if(newDonationBtn){
    newDonationBtn.onclick = () => {
      state.donateData = {username:'', amount:''};
      state.donateStep = 'form';
      render();
    };
  }

  // admin: set initial password
  const setPassBtn = document.getElementById('btn-set-password');
  if(setPassBtn){
    setPassBtn.onclick = async () => {
      const pw = document.getElementById('f-newpass').value;
      const errEl = document.getElementById('setpass-error');
      if(!pw){ return; }
      const result = await apiPost('/api/admin', {action:'set-password', password: pw});
      if(!result.ok){
        errEl.textContent = result.error || 'Could not set password.';
        errEl.style.display = 'block';
        return;
      }
      state.adminPassword = pw;
      state.adminAuthed = true;
      state.publicSettings.hasPassword = true;
      state.adminTab = 'settings';
      await loadAdminSettings();
      render();
      showToast('Admin password set.');
    };
  }

  // admin: login
  const loginBtn = document.getElementById('btn-login');
  if(loginBtn){
    loginBtn.onclick = async () => {
      const pw = document.getElementById('f-password').value;
      const errEl = document.getElementById('login-error');
      const result = await apiPost('/api/admin', {action:'check', password: pw});
      if(result.ok){
        state.adminPassword = pw;
        state.adminAuthed = true;
        await loadAdminSettings();
        await loadDonations();
        render();
      }else{
        errEl.style.display = 'block';
      }
    };
  }

  const logoutBtn = document.getElementById('btn-logout');
  if(logoutBtn){
    logoutBtn.onclick = () => {
      state.adminAuthed = false;
      state.adminPassword = null;
      state.adminSettings = null;
      render();
    };
  }

  document.querySelectorAll('[data-atab]').forEach(btn=>{
    btn.onclick = async () => {
      state.adminTab = btn.dataset.atab;
      if(state.adminTab === 'queue') await loadDonations();
      render();
    };
  });

  // mark complete
  document.querySelectorAll('[data-complete]').forEach(btn=>{
    btn.onclick = async () => {
      const id = btn.dataset.complete;
      btn.disabled = true;
      btn.textContent = 'Sending…';
      const result = await apiPost('/api/complete-donation', {password: state.adminPassword, id});
      if(!result.ok){
        showToast('Could not mark complete: ' + (result.error || 'unknown error'), 5000);
        btn.disabled = false;
        btn.textContent = 'Mark complete';
        return;
      }
      if(!result.discord || result.discord.reason === 'No webhook set.'){
        showToast('Marked complete. No Discord webhook is set — add one in Settings to post notifications.', 4000);
      }else if(result.discord.ok){
        showToast('Marked complete and posted to Discord.');
      }else{
        console.error('Discord webhook failed:', result.discord.reason);
        showToast('Marked complete, but Discord failed: ' + result.discord.reason, 6000);
      }
      await loadDonations();
      render();
    };
  });

  // clear history
  const clearHistoryBtn = document.getElementById('btn-clear-history');
  if(clearHistoryBtn){
    clearHistoryBtn.onclick = async () => {
      const confirmed = window.confirm('This permanently deletes every pending and completed donation record. This can\'t be undone. Continue?');
      if(!confirmed) return;
      clearHistoryBtn.disabled = true;
      clearHistoryBtn.textContent = 'Clearing…';
      const result = await apiPost('/api/clear-donations', {password: state.adminPassword});
      if(!result.ok){
        showToast('Could not clear history: ' + (result.error || 'unknown error'), 5000);
        clearHistoryBtn.disabled = false;
        clearHistoryBtn.textContent = 'Clear transaction history';
        return;
      }
      showToast('Transaction history cleared.');
      await loadDonations();
      render();
    };
  }

  // test webhook
  const testWebhookBtn = document.getElementById('btn-test-webhook');
  if(testWebhookBtn){
    testWebhookBtn.onclick = async () => {
      const statusEl = document.getElementById('webhook-test-status');
      const url = document.getElementById('s-webhook').value.trim();
      testWebhookBtn.disabled = true;
      testWebhookBtn.textContent = 'Sending…';
      statusEl.textContent = '';
      const result = await apiPost('/api/test-webhook', {password: state.adminPassword, webhookUrl: url});
      testWebhookBtn.disabled = false;
      testWebhookBtn.textContent = 'Send test message';
      if(result.ok){
        statusEl.style.color = 'var(--green-bright)';
        statusEl.textContent = 'Sent — check the Discord channel.';
      }else{
        statusEl.style.color = 'var(--crimson-bright)';
        statusEl.textContent = 'Failed: ' + (result.reason || result.error || 'unknown error');
        console.error('Webhook test failed:', result.reason || result.error);
      }
    };
  }

  // settings save
  const saveSettingsBtn = document.getElementById('btn-save-settings');
  if(saveSettingsBtn){
    saveSettingsBtn.onclick = async () => {
      const webhookUrl = document.getElementById('s-webhook').value.trim();
      const cashapp = document.getElementById('s-cashapp').value.trim();
      const venmo = document.getElementById('s-venmo').value.trim();
      const paypal = document.getElementById('s-paypal').value.trim();
      const result = await apiPost('/api/admin', {
        action:'update-settings',
        password: state.adminPassword,
        webhookUrl, cashapp, venmo, paypal
      });
      if(!result.ok){
        showToast('Could not save settings: ' + (result.error || 'unknown error'));
        return;
      }
      state.adminSettings = {webhookUrl, cashapp, venmo, paypal};
      state.publicSettings = {...state.publicSettings, cashapp, venmo, paypal};
      showToast('Settings saved.');
      render();
    };
  }
}

async function loadAdminSettings(){
  try{
    const result = await apiGet(`/api/admin?password=${encodeURIComponent(state.adminPassword)}`);
    if(result.ok) state.adminSettings = result.settings;
  }catch(e){
    console.error('Failed to load admin settings', e);
  }
}

async function loadDonations(){
  try{
    const result = await apiGet(`/api/donations?password=${encodeURIComponent(state.adminPassword)}`);
    if(result.ok) state.donations = result.donations;
  }catch(e){
    console.error('Failed to load donations', e);
  }
}

init();
</script>
</body>
</html>
